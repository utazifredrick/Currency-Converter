<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basketball Scoreboard</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="container">
      <div class="home">
        <h1>HOME</h1>
        <div id="home-count" class="dashboard">12</div>
        <button onclick="homePlusOne()">+1</button>
        <button onclick="homePlusTwo()">+2</button>
        <button onclick="homePlusThree()">+3</button>
      </div>
      <div class="reset-wrapper">
        <button id="reset-btn" onclick="reset()">New Game</button>
      </div>
      <div class="guest">
        <h1>GUEST</h1>
        <div id="guest-count" class="dashboard">8</div>
        <button onclick="guestPlusOne()">+1</button>
        <button onclick="guestPlusTwo()">+2</button>
        <button onclick="guestPlusThree()">+3</button>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
